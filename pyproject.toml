[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bugpilot"
version = "0.1.0"
description = "An evidence-backed debugging agent practice project"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3", "python-dotenv>=1,<2", "streamlit>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
