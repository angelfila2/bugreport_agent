[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bugpilot"
version = "0.1.0"
description = "An AI agent for evidence-backed incident investigation"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "streamlit>=1,<2",
    "langchain>=1.4.7,<2",
    "langchain-ollama>=1.1,<2",
    "langgraph>=1,<2",
    "ollama>=0.6,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
